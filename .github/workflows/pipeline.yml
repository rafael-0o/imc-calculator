name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: 20

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Build da aplicação
        run: npm run build

      - name: Publicar pasta dist/ como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Executar testes (npm test)
        run: npm test

  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Auditoria de segurança (npm audit --level=high)
        run: npm audit --level=high

  deploy:
    needs: [test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar artifact dist/
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: dist/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Enviar artifact para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4